name: Make Shorts

on:
  schedule:
    - cron: "17 3 * * *"   # every day 08:47 IST
  workflow_dispatch:
    inputs:
      count:
        description: "How many Shorts to make"
        default: "2"

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Kokoro voice model (only if engine is kokoro)
        run: |
          if grep -qE "^\s*engine:\s*kokoro" config.yaml; then
            mkdir -p models
            curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
            curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          fi

      - name: Make Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -W ignore -m pipeline.main --count "${{ github.event.inputs.count || '' }}"

      - name: Save videos (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Mark scripts as done
        run: |
          git config user.name "contour-bot"
          git config user.email "contour-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "Made Shorts run ${{ github.run_number }}"
          git push
