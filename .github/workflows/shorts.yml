name: Make Shorts

on:
  schedule:
    - cron: "13 20 * * *"   # 01:43 IST (GitHub often starts scheduled runs hours late)
    - cron: "13 22 * * *"   # backup 03:43 IST, skipped if today's Shorts already exist
    - cron: "43 23 * * *"   # backup 05:13 IST, skipped if today's Shorts already exist
  workflow_dispatch:
    inputs:
      count:
        description: "How many Shorts to make"
        default: "2"
      redo_id:
        description: "Re-make one script by id (leave empty for normal run)"
        default: ""

permissions:
  contents: write

concurrency:
  group: make-shorts
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's Shorts already exist (backup schedule)
        if: github.event_name == 'schedule'
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          d=$( (git fetch -q --depth 1 origin videos && git show FETCH_HEAD:status.json) 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('date_ist',''))" || true)
          echo "today=$today last=$d"
          if [ "$d" = "$today" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; fi


      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        if: env.SKIP != '1'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        if: env.SKIP != '1'
        run: pip install -r requirements.txt

      - name: Kokoro voice model (only if engine is kokoro)
        if: env.SKIP != '1'
        run: |
          if grep -qE "^\s*engine:\s*kokoro" config.yaml; then
            mkdir -p models
            curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
            curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          fi

      - name: Make Shorts
        if: env.SKIP != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -W ignore -m pipeline.main --count "${{ github.event.inputs.count || '' }}" --id "${{ github.event.inputs.redo_id || '' }}"

      - name: Publish videos to the 'videos' branch (newest 8 kept)
        if: env.SKIP != '1'
        run: |
          set -e
          ls output/*.mp4 >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin videos; then git checkout -q FETCH_HEAD -- .; fi
          cp "$GITHUB_WORKSPACE"/output/*.mp4 "$GITHUB_WORKSPACE"/output/*.json .
          for f in $(ls *.mp4 | sort | head -n -8); do rm -f "$f" "${f%.mp4}.json"; done
          python3 -c "import json,glob;json.dump([dict(json.load(open(j)),video=j[:-5]+'.mp4') for j in sorted(glob.glob('[0-9]*.json'))],open('pending.json','w'),indent=2)"
          NEW=$(cd "$GITHUB_WORKSPACE/output" && ls *.mp4 | tr '\n' ' ')
          python3 -c "import json,sys;json.dump({'date_ist':sys.argv[1],'run':int(sys.argv[2]),'new':sys.argv[3].split()},open('status.json','w'),indent=2)" "$(TZ=Asia/Kolkata date +%F)" "${{ github.run_number }}" "$NEW"
          git checkout -q --orphan pub
          git add -A
          git -c user.name=contour-bot -c user.email=contour-bot@users.noreply.github.com commit -qm "videos run ${{ github.run_number }}"
          git push -qf origin pub:videos

      - name: Save videos (download from the run page)
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Mark scripts as done
        if: env.SKIP != '1'
        run: |
          git config user.name "contour-bot"
          git config user.email "contour-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "Made Shorts run ${{ github.run_number }}"
          git push
